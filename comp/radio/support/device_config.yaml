radio:
  spi_bus: 1
  spi_cs: 0
  gpio_power_pin: 10
  gpio_interrupt_pin: 11
  udp_ground_rx_port: 12343
  udp_ground_tx_port: 12344
  buffer_size: 65536
  interrupt_threshold: 32768
  ms_timeout: 250
  max_rx_msgs_per_poll: 10
  max_tx_msgs_per_poll: 50
  max_subscriptions: 128
  debug: true
  # RF link model (simulator only). Defaults reproduce an ideal link; scenarios
  # and the radio backdoor use these to impair it for testing.
  #   link_mode: auto   -> in view when any listed ground station sees the spacecraft
  #              always -> always in view, never -> never in view
  link_mode: always
  uplink_delay_ms: 0
  downlink_delay_ms: 0
  uplink_drop_ppm: 0       # probability of losing a packet, parts per million
  downlink_drop_ppm: 0
  link_seed: 1             # seed for the (deterministic) packet-loss generator
  link_queue_depth: 64     # packets that can be in flight per direction
  # ground_stations: [names from cfg/drm/ground_stations.yaml]; omitted = all Earth stations
  # SDLS link security (CryptoLib): AES-256-GCM encrypt + authenticate. The ground CryptoLib container and
  # the flight radio app are both configured from these, so they always agree.
  uplink_encryption: true    # telecommands (radio RX)
  downlink_encryption: true  # telemetry (radio TX)
