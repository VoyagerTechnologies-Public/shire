mission_name: "drm"
eps:
  wire_default_loads: true

# Yellow and red telemetry limits, in engineering units. Outside the yellow range a parameter is WARNING and
# outside the red range it is CRITICAL in YAMCS. A scenario's own `limits:` key overrides these per parameter,
# and `null` removes one. Battery voltage is 16 + 8 x state of charge with the default 16 to 24 V span.
limits:
  /EPS/BATTERY_VOLTAGE:
    yellow: {min: 20.0}
    red: {min: 18.0}
  /EPS/BATTERY_TEMPERATURE:
    yellow: {min: 0.0, max: 40.0}
    red: {min: -10.0, max: 50.0}

# Spacecraft configurations
spacecraft:
  - name: "flatsat"
    config_file: "drm/spacecraft/flatsat.yaml"
  - name: "sat-1"
    config_file: "drm/spacecraft/sat-1.yaml"
  - name: "sat-2"
    config_file: "drm/spacecraft/sat-2.yaml"

# Fallback components if no spacecraft selected
components:
  - name: "adcs"
  - name: "demo"
  - name: "eps"
  - name: "radio"

# Scenarios for mission operations
scenarios:
  - name: "adcs-bdot-detumble"
    config_file: "drm/scenarios/adcs-bdot-detumble.yaml"
  - name: "adcs-boot-config"
    config_file: "drm/scenarios/adcs-boot-config.yaml"
  - name: "adcs-gps-time-sync"
    config_file: "drm/scenarios/adcs-gps-time-sync.yaml"
  - name: "adcs-modes-sweep"
    config_file: "drm/scenarios/adcs-modes-sweep.yaml"
  - name: "adcs-sunpoint-rotisserie"
    config_file: "drm/scenarios/adcs-sunpoint-rotisserie.yaml"
  - name: "adcs-target-track"
    config_file: "drm/scenarios/adcs-target-track.yaml"
  - name: "adcs-time-file-fallback"
    config_file: "drm/scenarios/adcs-time-file-fallback.yaml"
  - name: "adcs-truth-verification"
    config_file: "drm/scenarios/adcs-truth-verification.yaml"
  - name: "checkout"
    config_file: "drm/scenarios/checkout.yaml"
  - name: "cmd-tlm-validation"
