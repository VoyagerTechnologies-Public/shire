# Confirms target tracking works (issue #8 item 3), ground-visible: mode 4
# (target-track) already has solid unit coverage
# (comp/adcs/test-sim/test_adcs_sim.c's test_controller_mode4_track_* and
# test_wire_protocol_set_target_* families) but no confirmation through
# real ground telemetry until now, via AdcsComponent.ycs's TARGET-mode
# verify_stacks step.
#
# Manual (GUI + YAMCS):  set scenario: adcs-target-track in
#                        build/active.yaml, `make`, `make start`, then run
#                        comp/adcs/gsw/procedures/AdcsComponent.ycs by hand.
# Autonomous (no GUI):   make scenario SCENARIO=adcs-target-track
scenario_name: "adcs-target-track"
description: >
  Enables ADCS on the nominal-baseline reference orbit, runs
  AdcsComponent.ycs end to end (boot-config check, SUNSAFE convergence),
  then commands mode TARGET with TARGET=1 (+X inertial) and verifies body
  rates converge to near zero -- ground-visible proof the target-tracking
  controller reaches and holds a steady pointing state. Live testing
  originally found a persistent ~0.1 rad/s residual on two axes that never
  decayed; root cause was a quaternion scalar-order bug in
  rotate_inertial_to_body_safe() (adcs_sim.c) -- 42's qn is scalar-last
  [x,y,z,w], but the rotation math assumed scalar-first [w,x,y,z], corrupting
  the pointing-error computation for modes 3/4/5 (nadir/target/inertial;
  sun-pointing never touches qn, which is why it was unaffected). With the
  fix, this scenario converges within one poll (~0.02s) of the mode
  transition.
initial_conditions: "nominal-baseline"
overrides:
  debug: false
run_duration_s: 180
verify_stacks:
  - stack: "comp/adcs/gsw/procedures/AdcsComponent.ycs"
    at_s: 0
