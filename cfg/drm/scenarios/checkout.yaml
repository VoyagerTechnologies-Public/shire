# Automated PR-verification scenario. Runs YAMCS's CheckoutTest.ycs smoke
# stack (see atlas/docs/manual/core-concepts/ground-software.md's
# "Checkout stack" section) through cfg/shire-scenario.py's verify_stacks
# mechanism, instead of a human opening it in Procedures / Stacks and
# clicking through it in the YAMCS web UI.
#
# Manual (GUI + YAMCS):  set scenario: checkout in build/active.yaml,
#                        `make`, `make start`, then run CheckoutTest.ycs
#                        by hand -- unchanged from before this feature.
# Autonomous (no GUI):   make scenario SCENARIO=checkout
scenario_name: "checkout"
description: >
  Confirms the DRM reference spacecraft passes YAMCS's CheckoutTest.ycs
  smoke stack (cFE app NOOP/reset-counter checks, ADCS enable + SUNSAFE
  Sun-vector convergence, Simulith Server pause/play/speed backdoor, Demo
  backdoor config, and a CFDP upload/downlink round trip) headlessly.
  Uses nominal-baseline so the SUNSAFE Sun-vector convergence check has a
  known-good starting geometry to converge from within its timeout. Every
  counter check resets its own counter first, and the Demo config check
  establishes its own baseline first, so (unlike the IC choice) neither
  depends on this being a freshly started DRM -- confirmed live, the
  stack passes three runs in a row against one already-running instance.
initial_conditions: "nominal-baseline"
overrides:
  debug: false
# run_duration_s is a budget for verify_stacks to finish in, not a mission
# timeline to exercise -- CheckoutTest.ycs's 142 steps (including two CFDP
# round trips, confirmed live at ~4-7s each) complete in ~90s. Their
# advancement.wait is 1000ms (a GUI-facing pause, not a safety margin --
# see ground-software.md's "CFDP file download" bullet); the real safety
# margin comes from yamcs_commander.py's own 30s MIN_ACK_POLL_MS floor,
# not from this scenario's timing. 240s leaves >2.5x margin over the
# ~90s without wasting minutes waiting out a duration this scenario has
# no other use for.
#
# Deliberately left at the default (1x/real-time) SIMULITH_SPEED. This
# was tried at simulith_speed=5 with run_duration_s scaled up to 600 to
# keep the same real-time margin against the telemetry-freeze race (see
# "Tuning wall-clock speed" in atlas/docs/manual/how-to/scenarios.md).
# Confirmed live, twice: it works (no failures, shire-scenario.py's
# FSW_BOOT_SETTLE_S fix closed a real boot race the first attempt hit),
# but it's not a net win *for this scenario*. Verification itself did
# shrink (~76s to ~30s, exactly the tick-bound convergence step getting
# faster), but the achieved sim/real ratio wasn't linear with the
# requested speed, so run_duration_s=600's "wait for the clock to run
# out" phase cost ~212s -- more than the ~46s saved. The CFDP/HTTP floor
# (~33s, unaffected by speed) plus that duration-scaling cost make 1x the
# empirically faster choice here. This is a per-scenario judgment call,
# not a rule: a scenario with more tick-bound work and less real-time-
# bound work could still come out ahead -- verify with real timestamps
# before assuming either way.
run_duration_s: 240
verify_stacks:
  - stack: "cfg/drm/gsw/procedures/CheckoutTest.ycs"
    at_s: 0
