# Confirms all of ADCS's pointing modes work, ground-visible, end to end:
# enable -> sun point (SUNSAFE) -> nadir point (NADIR) -> track an arbitrary
# inertial vector target (a placeholder for "the Moon" -- see the stack's
# comment on that step), via AdcsModesSweep.ycs's verify_stacks steps.
#
# NADIR previously had no live scenario coverage at all (only unit tests).
# Arbitrary-vector targeting is new: SET_TARGET_VECTOR_CC lets ground (or a
# scenario) point modes 4/5 at any direction, not just the canned +X/-X
# inertial selectors SET_TARGET_CC offers.
#
# Manual (GUI + YAMCS):  set scenario: adcs-modes-sweep in
#                        build/active.yaml, `make`, `make start`, then run
#                        comp/adcs/gsw/procedures/AdcsModesSweep.ycs by hand.
# Autonomous (no GUI):   make scenario SCENARIO=adcs-modes-sweep
scenario_name: "adcs-modes-sweep"
description: >
  Enables ADCS on the nominal-baseline reference orbit, then sweeps through
  sun point (SUNSAFE, verifying Sun-vector convergence), nadir point
  (NADIR, verifying body rates settle near zero -- its first live scenario
  coverage), and target-track pointed at an arbitrary inertial vector via
  the new SET_TARGET_VECTOR_CC command (a placeholder direction standing in
  for "the Moon" until real lunar ephemeris is piped from 42 through
  simulith's IPC protocol into ADCS telemetry). Each mode transition is
  verified via real ground telemetry, not just unit-level control-law
  correctness.
initial_conditions: "nominal-baseline"
overrides:
  debug: false
run_duration_s: 180
verify_stacks:
  - stack: "comp/adcs/gsw/procedures/AdcsModesSweep.ycs"
    at_s: 0
