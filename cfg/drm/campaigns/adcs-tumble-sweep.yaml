# Sweep the initial tumble rate and measure how long the ADCS takes to point at the Sun. The Monte Carlo Analysis
# lesson runs this campaign, so it is small enough to finish in a short session.
name: "adcs-tumble-sweep"
description: >
  Sweeps the initial angular velocity on all three axes and measures how long the ADCS SUNSAFE convergence check takes
  to pass, so the spread of the time shows how much the answer depends on the starting tumble.
scenario: "adcs-truth-verification"
base_initial_conditions: "nominal-baseline"
trial_count: 6
seed: 20261029
max_parallel: 2

parameters:
  - path: "attitude.angular_velocity_deg_s.0"
    distribution: {type: "uniform", low: -2.0, high: 2.0}
  - path: "attitude.angular_velocity_deg_s.1"
    distribution: {type: "uniform", low: -2.0, high: 2.0}
  - path: "attitude.angular_velocity_deg_s.2"
    distribution: {type: "uniform", low: -2.0, high: 2.0}

metrics:
  - name: "time_to_sun_pointed_s"
    stack: "AdcsTruthComparison"
    step_index: 3            # SUNSAFE convergence verify immediately after its mode command
    field: "sim_elapsed_s"
