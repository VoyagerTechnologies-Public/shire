name: eps-nominal
description: EPS wiring, load and startup dispersions with required functional acceptance
  metrics
scenario: eps-functional
base_initial_conditions: nominal-baseline
trial_count: 100
seed: 20261006
max_parallel: 2
parameters:
- path: component_overrides.eps.battery_initial_soc
  mode: absolute
  distribution:
    type: uniform
    low: 0.2
    high: 0.95
- path: component_overrides.eps.battery_capacity_wh
  mode: absolute
  distribution:
    type: uniform
    low: 32
    high: 48
- path: component_overrides.eps.max_solar_power_w
  mode: absolute
  distribution:
    type: uniform
    low: 4.8
    high: 7.2
- path: component_overrides.eps.loads.demo.power_scale
  mode: absolute
  distribution:
    type: uniform
    low: 0.8
    high: 1.2
- path: component_overrides.eps.loads.demo.boot_delay_s
  mode: absolute
  distribution:
    type: uniform
    low: 0
    high: 2
- path: component_overrides.eps.loads.demo.switch
  distribution:
    type: choice
    values:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
- path: component_overrides.eps.loads.adcs.power_scale
  mode: absolute
  distribution:
    type: uniform
    low: 0.8
    high: 1.2
- path: component_overrides.eps.loads.adcs.boot_delay_s
  mode: absolute
  distribution:
    type: uniform
    low: 0
    high: 2
- path: component_overrides.eps.loads.adcs.switch
  distribution:
    type: choice
    values:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
- path: component_overrides.eps.loads.radio.power_scale
  mode: absolute
  distribution:
    type: uniform
    low: 0.8
    high: 1.2
- path: component_overrides.eps.loads.radio.boot_delay_s
  mode: absolute
  distribution:
    type: uniform
    low: 0
    high: 2
- path: component_overrides.eps.loads.radio.switch
  distribution:
    type: choice
    values:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
metrics:
- name: recovery_time_s
  stack: EpsPowerFunctional
  step_name: startup restored
  field: wall_end
  required: true
  elapsed_since:
    step_name: RECOVERY_BEGIN
    field: wall_start
- name: battery_voltage_v
  stack: EpsPowerFunctional
  step_name: acceptance metrics
  field: actual
  parameter: /EPS/BATTERY_VOLTAGE
  required: true
- name: solar_voltage_v
  stack: EpsPowerFunctional
  step_name: acceptance metrics
  field: actual
  parameter: /EPS/SOLAR_VOLTAGE
  required: true
- name: eps_device_count
  stack: EpsPowerFunctional
  step_name: acceptance metrics
  field: actual
  parameter: /EPS/DEVICE_COUNT
  required: true
- name: eps_device_errors
  stack: EpsPowerFunctional
  step_name: acceptance metrics
  field: actual
  parameter: /EPS/DEVICE_ERR_COUNT
  required: true
- name: demo_device_count
