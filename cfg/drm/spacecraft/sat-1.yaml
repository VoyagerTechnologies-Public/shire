spacecraft_name: "sat-1"
spacecraft_id: 1
visualization:
  # Build-time paths relative to the SHIRE checkout; assets stay in 42.
  earth_imagery: "42/World/BlueMarbleNG4096.ppm"
  model: "42/Model/stf1_red.obj"
  # The OBJ converter makes 42's Z-up body mesh glTF Y-up, with +X forward.
  # Map its original body origin into the center-of-mass frame used by truth.
  model_up_axis: Y
  model_forward_axis: X
  model_to_body:
    - [1, 0, 0, -0.12]
    - [0, 1, 0, 0.25]
    - [0, 0, 1, -0.2]
    - [0, 0, 0, 1]
components:
  - name: "adcs"
  - name: "demo"
  - name: "eps"
  - name: "radio"

# Specific configuration
adcs:
  string: "/dev/usart_2"
  handle: 2
  baudrate_hz: 115200
  ms_timeout: 250

demo:
  string: "/dev/usart_5"
  handle: 5
  baudrate_hz: 115200
  ms_timeout: 250

eps:
  i2c_bus_id: 0
  i2c_device_addr: 0x1E
  i2c_speed: 400000
  ms_timeout: 250

radio:
  spi_bus: 1
  spi_cs: 0
  gpio_power_pin: 10
  gpio_interrupt_pin: 11
