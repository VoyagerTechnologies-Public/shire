# A leaf vehicle: a low lunar orbiter with attitude, power, and a radio. The crosslink component joins this
# list when it lands, and leaves will then reach Earth only through the relay. The relay type extends this
# file and changes only what differs.
#
# ADCS note: the Moon has no global magnetic field, so magnetometer based modes such as B-dot detumble are not
# meaningful in lunar orbit. Use the Sun pointing and target tracking modes.
spacecraft_name: "leaf"
spacecraft_id: 1
visualization:
  # Build-time paths relative to the SHIRE checkout; assets stay in 42.
  earth_imagery: "42/World/BlueMarbleNG4096.ppm"
  model: "42/Model/stf1_red.obj"
  model_up_axis: Y
  model_forward_axis: X
  model_to_body:
    - [1, 0, 0, -0.12]
    - [0, 1, 0, 0.25]
    - [0, 0, 1, -0.2]
    - [0, 0, 0, 1]
components:
  - name: "adcs"
  - name: "eps"
  - name: "radio"

# Runs NASA's BPNode (Bundle Protocol). node_id is the vehicle's ipn node number, built into the flight software.
# A constellation can give each vehicle its own node number.
dtn:
  node_id: 101

# Specific configuration
adcs:
  string: "/dev/usart_2"
  handle: 2
  baudrate_hz: 115200
  ms_timeout: 250

eps:
  i2c_bus_id: 0
  i2c_device_addr: 0x1E
  i2c_speed: 400000
  ms_timeout: 250

radio:
  spi_bus: 1
  spi_cs: 0
  gpio_power_pin: 10
  gpio_interrupt_pin: 11
