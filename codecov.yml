codecov:
  notify:
    after_n_builds: 2

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true

comment:
  layout: "diff, flags, files"
  behavior: default
  require_changes: true
  require_base: true
  require_head: true
  hide_project_coverage: false
  after_n_builds: 2
