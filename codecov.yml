codecov:
  notify:
    after_n_builds: 3

flags:
  fsw:
    carryforward: false
  component-sim:
    carryforward: false
  simulith:
    carryforward: false

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: 80%
        threshold: 0%
        informational: false

comment:
  layout: "diff, flags, files"
  behavior: default
  require_changes: true
  require_base: true
  require_head: true
  hide_project_coverage: false
  after_n_builds: 3
