name: Base image

on:
  pull_request:
    paths:
      - cfg/Dockerfile.base
      - cfg/requirements.txt
      - .github/workflows/base-image.yml
  push:
    branches:
      - main
      - dev
    paths:
      - cfg/Dockerfile.base
      - cfg/requirements.txt
      - .github/workflows/base-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/voyagertechnologies-public/shire-base

jobs:
  validate:
    name: Validate amd64 image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: cfg
          file: cfg/Dockerfile.base
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=shire-base-amd64
          cache-to: type=gha,mode=max,scope=shire-base-amd64

  publish:
    name: Publish multi-architecture image
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=0.0.0
            type=sha,format=long,enable=${{ github.ref == 'refs/heads/dev' }}
      - uses: docker/build-push-action@v7
        with:
          context: cfg
          file: cfg/Dockerfile.base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=shire-base-multiarch
          cache-to: type=gha,mode=max,scope=shire-base-multiarch
