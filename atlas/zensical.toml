[project]
site_name = "SHIRE Atlas"
site_description = "Documentation for the Software & Hardware Integration Runtime Environment (SHIRE)."
site_author = "Voyager Technologies"
site_url = "https://voyagertechnologies-public.github.io/shire/"
extra_css = ["assets/css/custom.css"]

nav = [
  { "Home" = "index.md" },
  { "About" = "about.md" },
  { "Contact" = "https://voyagertechnologies.com/contact/" },
  { "Lab Manual" = [
    { "Handbook" = [
      { "Installation" = "manual/handbook/installation.md" },
      { "Getting Started" = "manual/handbook/getting-started.md" },
      { "FAQ" = "manual/handbook/faq.md" },
    ] },
    { "Core Concepts" = [
      { "Space Systems" = "manual/core-concepts/space-systems.md" },
      { "Architecture" = "manual/core-concepts/architecture.md" },
      { "Development Workflow" = "manual/core-concepts/development-workflow.md" },
      { "Flight Software" = "manual/core-concepts/flight-software.md" },
      { "Ground Software" = "manual/core-concepts/ground-software.md" },
      { "Simulations" = "manual/core-concepts/simulations.md" },
    ] },
    { "How-To Guides" = [
      { "Components" = "manual/how-to/components.md" },
      { "Component Mold" = "manual/how-to/component-mold.md" },
      { "Configuration" = "manual/how-to/configuration.md" },
      { "Development Board" = "manual/how-to/development-board.md" },
      { "Zynq QEMU PIL" = "manual/how-to/qemu-pil.md" },
      { "Configurable Linux Board PIL" = "manual/how-to/board-pil.md" },
      { "Zybo Linux PIL" = "manual/how-to/zybo-pil.md" },
      { "Docker" = "manual/how-to/docker.md" },
      { "Monte Carlo Campaigns" = "manual/how-to/monte-carlo-campaigns.md" },
      { "Performance" = "manual/how-to/performance.md" },
      { "Visualization and Replay" = "manual/how-to/visualization-replay.md" },
      { "Scenarios and Initial Conditions" = "manual/how-to/scenarios.md" },
      { "Scenario Screenshots" = "manual/how-to/scenario-screenshots.md" },
      { "EPS Validation" = "manual/how-to/eps-validation.md" },
      { "ADCS Validation" = "manual/how-to/adcs-validation.md" },
      { "Writing a Scenario Lesson" = "manual/how-to/writing-lessons.md" },
      { "Telemetry Limits" = "manual/how-to/telemetry-limits.md" },
      { "Uploading Tables and Patches" = "manual/how-to/uplink-patches.md" },
    ] },
  ] },
  { "Reference" = [
    { "Quick Reference" = "reference/quick-reference.md" },
    { "Glossary" = "reference/glossary.md" },
    { "Versions" = "reference/versioning.md" },
  ] },
  { "Design Reference Mission" = [
    { "Concept of Operations" = "drm/concept-of-operations.md" },
    { "Mission Requirements" = "drm/mission-requirements.md" },
    { "Verification and Validation" = "drm/verification-and-validation.md" },
  ] },
  { "Scenarios" = [
    { "Overview" = "scenarios/overview.md" },
    { "Commissioning" = "scenarios/commissioning.md" },
    { "Simulation Time and Repeatability" = "scenarios/simulation-time-repeatability.md" },
    { "Power and Eclipse" = "scenarios/power-eclipse.md" },
    { "Attitude Control" = "scenarios/attitude-control.md" },
    { "Cmd/Tlm Validation" = "scenarios/cmd-tlm-validation.md" },
  ] },
]

[project.theme]
logo = "assets/Voyager.svg"
favicon = "assets/Favicon_64x64.svg"
font = false

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tilde = {}
